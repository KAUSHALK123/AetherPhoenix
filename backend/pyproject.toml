[project]
name = "backend"
version = "0.1.0"
description = "Backend foundation for AetherPhoenix AI Desktop Assistant"
readme = "README.md"
authors = [
    { name = "AetherPhoenix Team", email = "team@aetherphoenix.local" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "black>=24.2.0",
    "httpx>=0.27.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests", "tests"]
