

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aether_phoenix_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    networks:
      - aether_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aether_phoenix_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    networks:
      - aether_network
    depends_on:
      - backend

networks:
  aether_network:
    name: aether_network
    driver: bridge
